<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e1d"/>
      <stop offset="1" stop-color="#05060f"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff2bd6" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <rect width="480" height="600" fill="url(#bg)"/>
  <g stroke="#00e5ff" stroke-opacity="0.12">
    <path d="M0 450 L480 400 M0 480 L480 440 M0 515 L480 490 M0 555 L480 545"/>
  </g>
  <!-- siluet placeholder foto -->
  <circle cx="240" cy="220" r="85" fill="url(#body)" stroke="#00e5ff" stroke-opacity="0.6" stroke-width="2"/>
  <path d="M100 600 C100 450 160 380 240 380 C320 380 380 450 380 600 Z" fill="url(#body)" stroke="#ff2bd6" stroke-opacity="0.5" stroke-width="2"/>
  <!-- visor -->
  <rect x="185" y="205" width="110" height="18" rx="9" fill="#00e5ff" opacity="0.7"/>
  <!-- scanline -->
  <rect x="0" y="140" width="480" height="4" fill="#00e5ff" opacity="0.35">
    <animate attributeName="y" from="0" to="596" dur="5s" repeatCount="indefinite"/>
  </rect>
  <text x="240" y="570" text-anchor="middle" font-family="monospace" font-size="14" fill="#00e5ff" opacity="0.7">PHOTO_PLACEHOLDER.JPG</text>
  <text x="240" y="120" text-anchor="middle" font-family="monospace" font-size="11" fill="#ff2bd6" opacity="0.8">// ganti dengan foto asli di lib/data.ts</text>
